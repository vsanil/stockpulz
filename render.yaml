services:
  # ── Webhook server (Telegram bot commands + Mini App API) ─────────────────────
  # This is the ONLY service that stays on Render.
  # All scheduled runs have been migrated to GitHub Actions (see .github/workflows/).
  - type: web
    name: stock-agent-webhook
    runtime: python
    buildCommand: pip install -r requirements.txt
    # 1 worker + threads: one copy of pandas/yfinance (avoids 512MB OOM) but
    # real concurrency for the I/O-bound handlers, and coherent in-memory caches.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 webhook:app
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GH_GIST_TOKEN
        sync: false
      - key: GIST_ID
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
