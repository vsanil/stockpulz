[pytest]
# Playwright UX tests require a browser and are slow — excluded from the default run.
# Run them explicitly: pytest tests/test_ux_playwright.py -n 2
# Or run everything:   pytest tests/ --run-ux
addopts = --ignore=tests/test_ux_playwright.py
markers =
    ux: end-to-end UX tests (require playwright + browser)
