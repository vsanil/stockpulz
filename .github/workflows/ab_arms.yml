name: Tournament Arms

# Engine variants traded side by side on the same market day, paper only, into
# their own test accounts. Production picks are never touched.
#
# 🔴 NO ANTHROPIC_API_KEY IS PASSED, AND THAT IS A SAFEGUARD, NOT AN OVERSIGHT.
# The owner's Option B (2026-09-19) is that only the LIVE arm spends a model
# call; arms here are selected deterministically by `arm_selector` from the
# screener's own ranking. If anyone reintroduces a Claude call to this path it
# fails loudly here instead of quietly tripling the monthly bill. Pinned by
# tests/test_tournament_arms.py.
#
# 🔴 THE `open` PHASE MUST BE PUNCTUAL, so it is NOT scheduled here.
# GitHub's scheduler runs this repo 1.6-6 h late. The synthetic user was buying
# at 1:53 PM ET against an entry window published at 7 AM, which did not model
# a real user and contaminated the reachability metric the engine findings rest
# on. An arm bought hours late measures lateness, not strategy.
#
#   ▶ TO START THE TOURNAMENT (one owner action, and it starts a ~3-month
#     experiment): create a cron-job.org job at 8:05 AM ET on weekdays that
#     POSTs to this workflow's dispatch endpoint with
#       {"ref":"main","inputs":{"phase":"open"}}
#     — five minutes after the synthetic user's 8:00 job, so the arms trade the
#     same market moment without three screeners racing it for rate limit.
#     Until that job exists, arms run only when dispatched by hand.
#
# `manage` is on GitHub's scheduler deliberately: it sells at target, stop or
# the time stop, where lateness costs a little precision rather than corrupting
# a measurement. Same reasoning that left the synthetic user's manage phase here.

on:
  schedule:
    - cron: "15 14-20 * * 1-5"   # 10:15 AM-4:15 PM ET hourly — manage only
  workflow_dispatch:
    inputs:
      phase:
        description: "open | manage | reset  (reset liquidates an arm's book and restarts its curve)"
        required: false
        default: "open"
      arms:
        description: "comma-separated arm names; blank = every arm"
        required: false
        default: ""
      dry_run:
        description: "true = screen, select and price against LIVE data but write nothing"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # each screener arm is a full 600-ticker screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt
      - name: Pick phase (a schedule event is always manage)
        id: p
        run: |
          if [[ -n "${{ github.event.inputs.phase }}" ]]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          else
            echo "phase=manage" >> $GITHUB_OUTPUT
          fi
      - name: Run arms
        run: |
          ARGS="--phase ${{ steps.p.outputs.phase }}"
          [ -n "${{ github.event.inputs.arms }}" ] && ARGS="$ARGS --arms ${{ github.event.inputs.arms }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python scripts/run_arms.py $ARGS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN:      ${{ secrets.GH_GIST_TOKEN }}
          # Storage backend. Must match Render, or GH Actions writes to the Gist
          # while the web service writes to Supabase — the split-brain of 2026-08-19.
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:            ${{ secrets.GIST_ID }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
