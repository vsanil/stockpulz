name: Keep Render Warm

# WAKE the free Render instance — the half cron-job.org cannot do itself.
#
# 🔴 The problem this solves, measured rather than assumed. Render Free spins
# down after ~15 min idle and takes ~55 s to come back, so the first person to
# tap a share link after a gap waits that long or gets no reply. cron-job.org
# fires punctually but its HTTP client is REFUSED by Render's sleeping edge in
# ~2 s (http=503, dozens of observations) — it can MAINTAIN warmth and can never
# ESTABLISH it. GitHub's own `schedule:` can establish it but fires 1.6-6 h late
# on this repo, so it cannot hit an hour.
#
# ✅ The chain that works, proven end-to-end 2026-09-19 against a genuinely cold
# instance (0 Render log lines for the preceding 4 h, control window verified):
#
#     19:02:08  cron-job.org POSTs this workflow's dispatch endpoint
#     19:02:12  runner curl starts                          (+4 s)
#     19:02:25  Render: Running 'gunicorn webhook:app …'    (+17 s, boot began)
#     19:03:03  gunicorn Listening at 0.0.0.0:10000         (+55 s, warm)
#
# A DISPATCH starts in seconds; only `schedule:` is late. That is the whole
# trick — punctuality from cron-job.org, reach from a GitHub runner.
#
# ⚠️ This job ESTABLISHES warmth once. It does not maintain it: Render idles out
# ~15 min later. Pair it with cron-job.org job 7746621 (7am-7pm ET, every 15 min),
# which is the half that client CAN do. One without the other is close to useless
# — the wake alone buys ~15 minutes, and the maintainer alone never gets started.

on:
  workflow_dispatch: {}   # cron-job.org dispatches this; also runnable by hand

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the instance and measure the cold start
        env:
          URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          set -uo pipefail          # NOT -e: a timeout is an expected outcome here
          if [ -z "${URL:-}" ]; then
            echo "::error::RENDER_EXTERNAL_URL is not set — nothing to wake."
            exit 1
          fi

          # --max-time 90 clears the measured ~55 s cold start with margin. The
          # old value was 30, so curl aborted mid-boot with exit 28 and `bash -e`
          # killed the step BEFORE it could report — a run that had successfully
          # woken the instance was marked a failure, which is how a working
          # mechanism gets mistaken for a broken one.
          START=$(date +%s)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL/health" || echo "000")
          ELAPSED=$(( $(date +%s) - START ))

          echo "http=$STATUS  elapsed=${ELAPSED}s"
          if [ "$STATUS" = "200" ] && [ "$ELAPSED" -lt 5 ]; then
            echo "✅ already warm (${ELAPSED}s) — something else had woken it"
          elif [ "$STATUS" = "200" ]; then
            echo "✅ WOKEN from cold in ${ELAPSED}s"
          else
            # Do not fail the run. The boot is asynchronous: curl can give up
            # while Render keeps starting, which is exactly what happened at the
            # old 30 s limit. Read the Render log before calling this broken.
            echo "::warning::no 200 after ${ELAPSED}s (http=$STATUS). The boot may "\
                 "still be in progress — check the Render log for 'Booting worker'."
          fi

          # Confirm by READ-BACK rather than trusting the first response.
          sleep 5
          VERIFY=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/health" || echo "000")
          echo "verify http=$VERIFY"
          [ "$VERIFY" = "200" ] || echo "::warning::still not serving — instance did not come up"
