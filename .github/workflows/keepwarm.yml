name: Keep Render Warm

# Pings /health every 10 minutes so Render never goes cold during the hours users
# are active. A cold server → the first /start or button tap waits ~30-60s for a
# boot (or the reply is dropped mid-boot), which reads as "the bot isn't working".
#
# Window: 10:00–22:59 UTC (~6 AM–6 PM ET). Deliberately STARTS BEFORE the 11:00 UTC
# (7 AM ET) morning-picks run — users interact right after picks land, and the old
# 12:00-UTC start left that peak window cold (a 7 AM ET /start hit a cold server).
# Covers through the EOD/evening jobs (~20-21 UTC). Cost: ~78 runs/day × ~10s ≈
# 13 min/day — well within the free tier. GH cron can lag a few min under load;
# for hard reliability, mirror this as a cron-job.org /health ping.
on:
  schedule:
    - cron: "*/10 10-22 * * *"     # Every 10 min, ~6 AM–6 PM ET (warms before the 7 AM run)

  workflow_dispatch: {}   # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.RENDER_EXTERNAL_URL }}/health")
          echo "Health check status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "⚠️  Unexpected status $STATUS — server may be starting up"
          else
            echo "✅ Server is warm"
          fi
