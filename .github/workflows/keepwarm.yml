name: Keep Render Warm

# Pings /health so Render isn't cold when someone actually uses the bot. A cold
# server → the first /start or button tap waits ~30-60s for a boot (or the reply is
# dropped mid-boot), which reads as "the bot isn't working".
#
# 🔴 GitHub Actions minutes are free on a public repo, but Render instance-hours
# are NOT: the free plan allows 750 h/month and every ping WAKES the service for
# ~15 min. Warming 24/7 costs ~744 h/month = 99% of the cap, leaving no margin —
# exceed it and Render suspends the service until the next billing cycle.
#
# 🔴 StockPulz is on Render's STARTER (paid) plan: it NEVER spins down, and paid
# services draw NOTHING from the 750 h free pool. So this workflow, the
# cron-job.org /health job and the in-process gate are all NO-OPS today — kept
# only so the service still warms itself if it is ever downgraded to Free.
# Proven Aug 11: StockPulz stayed warm through 45 min of total silence while
# PiQValet and pricedrop (both Free, same account) went cold in 20 min.
#
# 🔴 This MUST stay inside that window. Every ping wakes the service for ~15 min,
# so a GH ping outside the paid window is pure cost: the previous 10:00-03:59 UTC
# schedule would have fired ~6 times a day outside it, ~46 h/month for nothing.
# If the cron-job.org window changes, change this to match or it silently
# reinflates the bill.
#
# ⚠️ This workflow is NOT what actually keeps Render warm. Measured over 13
# consecutive runs its real cadence is ~53 min (GitHub throttles */10 hard), and
# Render sleeps after ~15 min idle — so it cannot hold the service up. The clean
# 15-min ticks in the Render log come from the cron-job.org /health job. Narrowing
# THAT job to the same window is what changes the bill; this file only stops GH
# from waking the service during the cold hours.
on:
  # 🔴 SCHEDULE DISABLED 2026-08-11 — StockPulz is on Render's Starter plan and
  # never spins down, so this pinged an already-running service ~27 times a day
  # (and cluttered the Actions history enough to help hide a failing Tests run).
  # Kept, not deleted: uncomment if the service is ever downgraded to Free.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}   # still runnable by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.RENDER_EXTERNAL_URL }}/health")
          echo "Health check status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "⚠️  Unexpected status $STATUS — server may be starting up"
          else
            echo "✅ Server is warm"
          fi
