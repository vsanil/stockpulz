name: Keep Render Warm

# Pings /health every 10 minutes during trading hours so Render never goes cold.
# Cold Render server → Telegram callback queries time out → button clicks appear broken.
#
# Schedule: 8:30 AM – 5:00 PM ET, Mon–Fri  (12:30–21:00 UTC covers EDT + EST)
# Cost: ~10s per run × 54 runs/day × 5 days = ~45 min/week — well within free tier.

on:
  schedule:
    - cron: "*/10 12-21 * * *"     # Every 10 min, ~8:30 AM–5 PM ET (every day)

  workflow_dispatch: {}   # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.RENDER_EXTERNAL_URL }}/health")
          echo "Health check status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "⚠️  Unexpected status $STATUS — server may be starting up"
          else
            echo "✅ Server is warm"
          fi
