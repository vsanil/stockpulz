name: Keep Render Warm

# Pings /health every 10 minutes, 24/7, so Render never goes cold. A cold server →
# the first /start or button tap waits ~30-60s for a boot (or the reply is dropped
# mid-boot), which reads as "the bot isn't working". This bit NEW users worst:
# they click a share link at ANY hour (other timezones, evenings, weekends), and
# a cold server ate their first /start — so the invite looked broken.
#
# 24/7 because share-link clicks aren't confined to trading hours. This repo is
# PUBLIC → GitHub Actions minutes are unlimited, so round-the-clock warming is free.
# Render free tier spins down after ~15 min idle; 10-min pings keep it hot. GH cron
# can lag a few min under load — for hard reliability mirror as a cron-job.org ping.
on:
  schedule:
    - cron: "*/10 * * * *"     # Every 10 min, 24/7 — Render never goes cold

  workflow_dispatch: {}   # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.RENDER_EXTERNAL_URL }}/health")
          echo "Health check status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "⚠️  Unexpected status $STATUS — server may be starting up"
          else
            echo "✅ Server is warm"
          fi
