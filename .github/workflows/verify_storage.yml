name: Verify Storage

# Manual only — a diagnostic, not a monitor. Run it after changing SUPABASE_KEY
# or an RLS policy to confirm the CI surface can actually WRITE, then check
# Render separately via /health and the app logs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do after the compare
        required: true
        default: compare-only
        type: choice
        options: [compare-only, reconcile-dry-run, reconcile-apply]
      only:
        description: >-
          Optional comma-separated filenames to restrict the reconcile to.
          Use it when a blanket run would be unsafe — picks.json is
          GIST_WINS but the Gist copy can be the SMALLER one.
        required: false
        default: ""
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify storage backend + write access
        env:
          GIST_ID:        ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
        run: python scripts/verify_storage.py
      - name: Compare Gist vs Supabase (drift after a stalled migration)
        if: always()
        env:
          GIST_ID:        ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: python scripts/verify_storage.py --compare
      - name: Diff the files that still differ
        if: always()
        continue-on-error: true
        env:
          GIST_ID:        ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
        run: |
          # `only` doubles as the diff target list when supplied, so any file
          # can be inspected without editing this workflow.
          FILES="${{ inputs.only }}"
          FILES="${FILES//,/ }"
          for f in ${FILES:-data_quality.json user_trades.json}; do
            python scripts/verify_storage.py --diff "$f" || true
          done
      - name: Alert round-trip on this surface
        if: always()
        continue-on-error: true
        env:
          GIST_ID:        ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
        run: python scripts/verify_storage.py --alert-roundtrip
      - name: Reconcile Gist -> Supabase (${{ inputs.mode }})
        if: inputs.mode != 'compare-only'
        env:
          GIST_ID:        ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "reconcile-dry-run" ]; then
            python scripts/reconcile_storage.py --dry-run --only "${{ inputs.only }}"
          else
            python scripts/reconcile_storage.py --only "${{ inputs.only }}"
          fi
