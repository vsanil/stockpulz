name: Self-Heal on Monitor Failure

# When a monitor (Daily Canary / Synthetic User / Full Sweep) FAILS, this runs
# Claude Code headlessly to diagnose + fix on a branch, gates on the FULL test
# suite, and — if green — auto-merges to main (Render auto-deploys). After the
# deploy it smoke-checks /health and LOUDLY alerts the admin if it broke the app.
# The admin is DM'd at start ("🔧 fixing") and finish ("✅ merged & deployed" /
# "🚨 deploy broke health" / "⚠️ tests red — draft PR" / "⚠️ couldn't fix").
#
# SAFETY: a MANUAL workflow_dispatch NEVER auto-merges (it only opens a PR) so the
# loop can be validated without shipping anything. Auto-merge fires only on a real
# workflow_run failure with all tests green.
#
# workflow_run matches by the workflow `name:` (not filename), and only fires for
# workflows on the default branch (main) — a GitHub requirement.

on:
  workflow_run:
    workflows: ["Daily Canary", "Synthetic User", "Full Sweep", "Pick Evaluation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "A failed run id to diagnose (test the loop — never auto-merges)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write          # claude-code-action@v1 authenticates via GitHub OIDC

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  self-heal:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
      TG_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT:     ${{ secrets.TELEGRAM_CHAT_ID }}
      RENDER_URL:  ${{ secrets.RENDER_EXTERNAL_URL }}
      # auto-merge only on a real monitor failure, never on a manual test dispatch
      AUTO_MERGE:  ${{ github.event_name == 'workflow_run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve failed run + fetch logs
        id: ctx
        run: |
          RID="${{ github.event.workflow_run.id || github.event.inputs.failed_run_id }}"
          echo "monitor=${{ github.event.workflow_run.name || 'manual test' }}" >> "$GITHUB_OUTPUT"
          echo "url=${{ github.event.workflow_run.html_url }}"                    >> "$GITHUB_OUTPUT"
          if [ -n "$RID" ]; then
            gh run view "$RID" --log > /tmp/failure.log 2>&1 || true
            grep -iE "FAIL |ACTION NEEDED|🔴|Traceback|Error|FAILED:|• " /tmp/failure.log | head -80 > /tmp/failure_summary.txt || true
          fi
          [ -s /tmp/failure.log ] || echo "(no logs — inspect the repo/monitors)" > /tmp/failure.log
          cat /tmp/failure_summary.txt 2>/dev/null || true

      - name: Notify admin — fixing
        run: |
          # 🔴 This used to promise "I'll merge + deploy it and confirm". Since the
          # PR gate it never merges, so the very first message a human sees was
          # false — and someone reading only this one would assume the fix had
          # shipped itself. Say what actually happens.
          # No parse_mode: see the result notifier for why formatting costs
          # delivery here.
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=🔧 A ${{ steps.ctx.outputs.monitor }} check failed — auto-diagnosing. If a fix passes the tests I will open it for YOUR review; nothing merges or deploys on its own." \
            >/dev/null || true

      - name: Branch
        run: |
          git config user.name  "Claude Self-Heal"
          git config user.email "noreply@anthropic.com"
          BR="auto/self-heal-$(date +%s)"
          git checkout -b "$BR"
          echo "$BR" > /tmp/branch

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # 🔴 pytest EXPLICITLY. It is not a runtime dependency, so it is not in
      # requirements.txt — test.yml has always installed it separately. Without
      # it the hard gate below died with `No module named pytest`, reported
      # green=false, and self-heal could NEVER reach the `proposed` branch. Five
      # consecutive runs (Aug 21-24) wrote real fixes to branches that were
      # never proposed, and the DM blamed red tests that had never run.
      - run: pip install -r requirements.txt pytest
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude Code — diagnose & fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > /tmp/prompt.txt <<'PROMPT'
          A monitoring workflow just failed in this app's CI. Diagnose it and fix it on the CURRENT git branch (already checked out). Do NOT push, merge, or open a PR — the surrounding workflow handles that.

          Be efficient and decisive — you have a limited turn budget. Read only what you need (the failure log + the one check/module involved), don't explore the whole repo. If the current code already handles the failure and the tests pass, STOP with no changes.

          STEP 1 — read the evidence:
            - The failure log is at /tmp/failure.log (compact summary at /tmp/failure_summary.txt). Read it to see exactly which checks failed and for which monitor.
            - Read CLAUDE.md — it documents this app's bug patterns AND the recurring monitor/canary FALSE-ALARM classes (weekend crypto delivery; the synthetic-user bot draining paper cash / holding pre-existing positions; date-window expectations). MANY monitor failures are the CHECK being wrong, not the app.

          STEP 2 — diagnose the ROOT cause and classify:
            - FALSE ALARM: the monitor/check assumes something no longer true (clean slate, exact date, sufficient cash). Fix = make the check robust in scripts/. NEVER weaken a guard that is correctly catching a real problem.
            - TRANSIENT INFRASTRUCTURE, NOT A BUG: if "Pick Evaluation" failed with "LEDGER SAVE FAILED", that is GitHub rate-limiting a gist PATCH (409/403). The retry/backoff already exists and the exit-1 is deliberate so a lost day is loud. Make NO code change — a speculative edit here would auto-deploy for nothing. Just stop and say it was transient. (The lost day itself is NOT recoverable in code: record_today only reads TODAY's picks.json.)
            - REAL APP BUG: fix the app code and ADD a regression test.
            If you are NOT confident it is a genuine fix, make NO changes and stop — a wrong auto-merged fix would deploy live to real users.

          STEP 3 — apply the minimal, correct fix, matching the surrounding code style.

          STEP 4 — verify. Run BOTH and make them pass:
              python -m pytest tests/ -q
              python scripts/check_js.py

          STEP 5 — commit all changes (nothing left staged) with a clear message: what failed, the root cause, and the fix. Do NOT push.
          PROMPT
          claude -p "$(cat /tmp/prompt.txt)" \
            --model claude-sonnet-5 \
            --max-turns 30 \
            --dangerously-skip-permissions \
            2>&1 | tail -60 || echo "[self-heal] claude exited non-zero: $? (downstream steps will report no-fix)"

      - name: Verify tests (hard gate)
        id: verify
        run: |
          # Can the gate even run? A missing runner is an INFRASTRUCTURE fault,
          # not a red suite, and reporting it as "tests failed" is what let a
          # broken gate look like a stream of bad fixes for four days.
          if ! python -m pytest --version >/dev/null 2>&1; then
            echo "green=false"    >> "$GITHUB_OUTPUT"
            echo "gate=unrunnable" >> "$GITHUB_OUTPUT"
            echo "::error::pytest is not installed — the hard gate cannot run."
            exit 0
          fi
          python -m pytest tests/ -q >/tmp/pytest.txt 2>&1; PT=$?
          python scripts/check_js.py >/tmp/js.txt 2>&1;    JS=$?
          if [ "$PT" -eq 0 ] && [ "$JS" -eq 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"; echo "gate=ok" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"; echo "gate=red" >> "$GITHUB_OUTPUT"
            tail -20 /tmp/pytest.txt || true
            [ "$JS" -eq 0 ] || tail -10 /tmp/js.txt || true
          fi

      - name: Ship — push to main (auto+green), branch (auto+red), or report (test)
        id: ship
        run: |
          BR=$(cat /tmp/branch)
          # Claude may have committed the fix itself (the prompt says to), OR left
          # it uncommitted — handle both: stage+commit anything loose (no-op if
          # already committed), then detect the fix by diffing HEAD vs main (NOT
          # the staging area — that's empty once Claude has committed).
          git add -A
          git commit -m "auto: self-heal ${{ steps.ctx.outputs.monitor }} failure

          Autonomous fix for a failed ${{ steps.ctx.outputs.monitor }} run (${{ steps.ctx.outputs.url }})." 2>/dev/null || true
          git fetch origin main -q
          if git diff --quiet origin/main HEAD; then
            echo "outcome=nofix" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NF=$(git diff --name-only origin/main HEAD | tr '\n' ' ')
          echo "files=$NF" >> "$GITHUB_OUTPUT"
          # 🔴 PR-GATED since 2026-08-23 (owner's call). NOTHING self-heal writes
          # reaches main or production without a human. Previously a green test
          # run pushed straight to main and Render deployed it, so an LLM's
          # change could reach real users with the suite as the only gate —
          # ca03822 did exactly that on 2026-08-22 while nobody was looking.
          # The fix was sound, but "sound this time" is not a control.
          git push -u origin "$BR"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          if [ "$AUTO_MERGE" != "true" ]; then
            echo "outcome=testfix" >> "$GITHUB_OUTPUT"           # manual run
          elif [ "${{ steps.verify.outputs.green }}" = "true" ]; then
            # Try a real PR. `pull-requests: write` is declared, but the REPO
            # setting "Allow GitHub Actions to create and approve pull requests"
            # may be off — in which case fall back to a one-click compare link
            # rather than demanding a broader permission than this needs.
            PR=$(gh pr create --base main --head "$BR" \
                   --title "self-heal: $M" \
                   --body "Autonomous fix for a failed $M run (${URL}).

            Tests green. **Review before merging** — this was written without a human in the loop.

            Files: ${NF}" 2>/dev/null | tail -1) || true
            case "$PR" in
              https://*) : ;;
              *) PR="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BR}?expand=1" ;;
            esac
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "outcome=proposed" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=branch" >> "$GITHUB_OUTPUT"            # red → branch, no PR
          fi

      # DORMANT while PR-gated: nothing is merged by this workflow, so this
      # never fires. Kept intact so re-enabling auto-merge restores the
      # commit-vs-/health verification that caught the Aug 11 non-deploy.
      - name: Post-deploy health check
        id: health
        if: ${{ steps.ship.outputs.outcome == 'merged' }}
        run: |
          # 🔴 This compares the COMMIT /health reports against the SHA we merged.
          # It used to assert only "HTTP 200", which STALE CODE RETURNS JUST AS
          # HAPPILY — so on 2026-08-11, with Render autoDeploy silently switched
          # off, self-heal merged fixes to main and DM'd "merged & deployed" for
          # an unknown period while none of them ever shipped. A liveness check
          # cannot detect a non-deploy; only a version check can.
          # --short=7 pinned: git auto-extends the abbreviation as a repo grows,
          # while /health hardcodes [:7]. Unpinned, that drift would make every
          # SUCCESSFUL deploy report "stale" — a false alarm teaches you to ignore it.
          WANT=$(git rev-parse --short=7 HEAD)
          echo "want=$WANT" >> "$GITHUB_OUTPUT"
          H="bad"; GOT=""
          # Render builds this repo (pandas/numpy/matplotlib) in a few minutes;
          # poll rather than guessing one sleep long enough to cover it.
          for i in $(seq 1 12); do
            sleep 30
            BODY=$(curl -s --max-time 20 "${RENDER_URL}/health" || echo "")
            [ -z "$BODY" ] && { H="bad"; continue; }
            GOT=$(printf '%s' "$BODY" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ "$GOT" = "$WANT" ]; then H="ok"; break; fi
            # Responding, but not yet (or never) running our commit.
            H="stale"
          done
          # No commit field at all, or the app's own "unknown" placeholder, means
          # we CANNOT tell — report that honestly rather than as a stale deploy.
          case "$GOT" in ""|unknown) [ "$H" = "stale" ] && H="unverified" ;; esac
          echo "got=$GOT" >> "$GITHUB_OUTPUT"
          echo "status=$H" >> "$GITHUB_OUTPUT"

      - name: Notify admin — result
        if: always()
        run: |
          O="${{ steps.ship.outputs.outcome }}"; H="${{ steps.health.outputs.status }}"
          BR="${{ steps.ship.outputs.branch }}"; FILES="${{ steps.ship.outputs.files }}"
          M="${{ steps.ctx.outputs.monitor }}"; URL="${{ steps.ctx.outputs.url }}"
          case "$O" in
            merged)
              WANT="${{ steps.health.outputs.want }}"; GOT="${{ steps.health.outputs.got }}"
              case "$H" in
                ok)   MSG="✅ Auto-fixed *$M* — tests green, merged to main, and /health confirms commit \`$WANT\` is LIVE. Files: ${FILES}" ;;
                stale) MSG="🚨 Auto-fixed *$M* and merged \`$WANT\`, but /health still reports \`$GOT\` after 6 min — THE FIX IS NOT DEPLOYED. Check Render autoDeploy / build logs. Files: ${FILES}" ;;
                unverified) MSG="⚠️ Auto-fixed *$M* and merged \`$WANT\`. /health responds but reports NO commit — cannot confirm the deploy shipped. Verify in Render. Files: ${FILES}" ;;
                *)    MSG="🚨 Auto-fixed & merged *$M* but /health is NOT responding — check now / roll back in Render. Files: ${FILES}" ;;
              esac ;;
            proposed)
              PR="${{ steps.ship.outputs.pr }}"
              MSG=$(printf '🔧 SELF-HEAL PROPOSED A FIX — YOUR REVIEW NEEDED\n\nMonitor: %s\nTests: green\nFiles: %s\nBranch: %s\n\n👉 %s\n\nWritten by an LLM with no human in the loop. Nothing is deployed and nothing reaches main until you merge it.' "$M" "$FILES" "$BR" "$PR") ;;
            branch)
              if [ "${{ steps.verify.outputs.gate }}" = "unrunnable" ]; then
                MSG="🚨 Self-heal wrote a fix for $M but THE TEST GATE COULD NOT RUN (pytest missing) — pushed to $BR, NOT proposed. This is an infrastructure fault, not a bad fix: ${URL}"
              else
                MSG="⚠️ Self-heal produced a fix for $M but tests are RED — pushed to $BR, NOT proposed for merge. Needs you: ${URL}"
              fi ;;
            testfix) MSG="🧪 Self-heal TEST run for *$M*: fix on \`$BR\` (files: ${FILES}), tests green — no PR (manual run)." ;;
            nofix)   MSG="⚠️ Couldn't confidently auto-fix *$M* — needs you. Failed run: ${URL}" ;;
            *)       MSG="⚠️ Self-heal for *$M* ended without a result / errored — check the Actions log: ${URL}" ;;
          esac
          # 🔴 NO parse_mode. Messages carry snake_case filenames, and an odd
          # number of underscores makes Telegram reject the whole message with a
          # 400 — silently, when the response is discarded. Plain text always
          # delivers, and delivery matters more than bold text.
          RESP=$(curl -s -w '\n%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}") || true
          CODE=$(printf '%s' "$RESP" | tail -1)
          if [ "$CODE" != "200" ]; then
            echo "::error::self-heal could not notify the admin (HTTP $CODE): $(printf '%s' "$RESP" | head -c 300)"
          else
            echo "[self-heal] admin notified (HTTP 200)"
          fi
