name: Synthetic User

# An automated "active user" for stabilization testing + pick-quality evidence.
# Opens real + paper positions from the day's picks (with target alerts +
# watchlist) in the morning, then manages them intraday (sell at target / cut at
# stop). It ONLY touches the tickers it opened (per-account state file).
#
# It trades on a VIRTUAL TEST account (SYNTHETIC_CHAT_ID, default 900000001) so
# the owner's real account stays clean; REPORTS still go to the owner. That id is
# deliberately NOT in allowed_users, so the robot's mechanical fills are excluded
# from community stats and from the LLM pick-feedback loop.

on:
  schedule:
    - cron: "0 12 * * 1-5"        # 8 AM ET — open (after the 7 AM morning picks)
    - cron: "0 14-20 * * 1-5"     # 10 AM–4 PM ET hourly — manage (market hours)
  workflow_dispatch:
    inputs:
      phase:
        description: "open | manage"
        required: false
        default: "manage"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt
      - name: Pick phase (12:00 UTC = open, else manage)
        id: p
        run: |
          if [[ -n "${{ github.event.inputs.phase }}" ]]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.schedule }}" == "0 12 * * 1-5" ]]; then
            echo "phase=open" >> $GITHUB_OUTPUT
          else
            echo "phase=manage" >> $GITHUB_OUTPUT
          fi
      - name: Run synthetic user
        run: python scripts/synthetic_user.py --phase ${{ steps.p.outputs.phase }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Virtual test account it TRADES on (optional — code defaults to 900000001)
          SYNTHETIC_CHAT_ID:  ${{ secrets.SYNTHETIC_CHAT_ID }}
          GH_GIST_TOKEN:      ${{ secrets.GH_GIST_TOKEN }}
          # Storage backend. Must match Render, or GH Actions writes to the Gist
          # while the web service writes to Supabase — the split-brain of 2026-08-19.
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:            ${{ secrets.GIST_ID }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
