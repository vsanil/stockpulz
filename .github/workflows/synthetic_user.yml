name: Synthetic User

# An automated "active user" for stabilization testing + pick-quality evidence.
# Opens real + paper positions from the day's picks (with target alerts +
# watchlist) in the morning, then manages them intraday (sell at target / cut at
# stop). It ONLY touches the tickers it opened (per-account state file).
#
# It trades on a VIRTUAL TEST account (SYNTHETIC_CHAT_ID, default 900000001) so
# the owner's real account stays clean; REPORTS still go to the owner. That id is
# deliberately NOT in allowed_users, so the robot's mechanical fills are excluded
# from community stats and from the LLM pick-feedback loop.

# 🔴 The OPEN phase is NOT scheduled here — it is dispatched by cron-job.org job
# 8449904 at 8:00 AM ET weekdays. Measured 2026-09-15: GitHub's scheduler ran
# only 3 of the 8 jobs it was asked for each weekday, and fired `open` at 17:53
# UTC on Mon 09-14 and 16:04 on Fri 09-11 against a nominal 12:00 — 4-6 HOURS
# LATE. `open` is the phase that BUYS, so a late run buys at 2 PM ET prices
# against an entry window published at 7 AM, which does not model a real user
# and quietly contaminated the reachability metric the engine findings rest on.
# cron-job.org is punctual to the second; the other 17 market-timed triggers
# moved there on 2026-09-05 and this one was simply left behind.
#
# ⚠️ DO NOT re-add a `0 12` cron here. Both would fire and the bot would open
# TWICE — the same double-send reasoning that keeps the morning relay off
# GitHub's scheduler. Pinned by tests/test_synthetic_open_is_not_double_scheduled.py
on:
  schedule:
    - cron: "0 14-20 * * 1-5"     # 10 AM–4 PM ET hourly — manage (market hours)
  workflow_dispatch:
    inputs:
      phase:
        description: "open | manage | reset  (reset liquidates the paper book and restarts the equity curve — by hand, once)"
        required: false
        default: "manage"
      dry_run:
        description: "true = drive the phase against LIVE data with NO writes and NO DM (proves a code path on CI, where prices resolve)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt
      - name: Pick phase (12:00 UTC = open, else manage)
        id: p
        run: |
          if [[ -n "${{ github.event.inputs.phase }}" ]]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.schedule }}" == "0 12 * * 1-5" ]]; then
            echo "phase=open" >> $GITHUB_OUTPUT
          else
            echo "phase=manage" >> $GITHUB_OUTPUT
          fi
      - name: Run synthetic user
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            python scripts/synthetic_user.py --phase ${{ steps.p.outputs.phase }} --dry-run
          else
            python scripts/synthetic_user.py --phase ${{ steps.p.outputs.phase }}
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Virtual test account it TRADES on (optional — code defaults to 900000001)
          SYNTHETIC_CHAT_ID:  ${{ secrets.SYNTHETIC_CHAT_ID }}
          GH_GIST_TOKEN:      ${{ secrets.GH_GIST_TOKEN }}
          # Storage backend. Must match Render, or GH Actions writes to the Gist
          # while the web service writes to Supabase — the split-brain of 2026-08-19.
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:            ${{ secrets.GIST_ID }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
