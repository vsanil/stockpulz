name: Engine Analysis

# Daily, after the market close and the evaluator have both had their say.
# Writes analysis/ENGINE_FINDINGS.md and commits it, so the next session opens
# with a standing agenda instead of re-deriving it.
on:
  schedule:
    - cron: "0 22 * * *"      # 6 PM ET — after eod_summary (20:15 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse the engine
        env:
          GIST_ID:        ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # --propose attaches a concrete fix to open TECHNICAL BUG findings so
        # they arrive on /admin with Approve/Decline rather than sitting there
        # forever. Engine findings are NOT auto-proposed: they need the n>=30
        # outcome evidence the tournament produces (Phase 3).
        run: python scripts/analyze_engine.py --notify --propose
      - name: Commit the findings if they changed
        run: |
          git config user.name  "Engine Analysis"
          git config user.email "noreply@anthropic.com"
          if git diff --quiet -- analysis/; then
            echo "findings unchanged — nothing to commit"
          else
            git add analysis/
            # [skip render] — this commit touches ONLY analysis/ENGINE_FINDINGS.md,
            # regenerated output the web service never reads (decisions live in
            # Supabase). Without the tag Render rebuilt and RESTARTED the service
            # every night at ~00:00 UTC for a markdown change — a daily cold
            # process (module imports + backend re-verification) for nothing.
            # Render-specific: GitHub Actions still run on this push.
            git commit -m "analysis: refresh engine findings [skip render]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
