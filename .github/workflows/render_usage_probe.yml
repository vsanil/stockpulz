# THROWAWAY probe — does Render's API expose free instance hours?
# Delete once answered. Prints shape only; the key never appears in output.
name: Render usage probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can service EVENTS reconstruct awake-time?
        env:
          K: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          SID=srv-d8l6aunlk1mc73ck7b30   # PriceDrop, sleeps often -> good test
          for p in "/v1/services/$SID/events?limit=12" "/v1/services/$SID"; do
            C=$(curl -s -o /tmp/e.json -w '%{http_code}' -H "Authorization: Bearer $K" "https://api.render.com$p")
            echo "  $p -> $C"
          done
          echo "  --- event types present ---"
          curl -s -H "Authorization: Bearer $K" "https://api.render.com/v1/services/$SID/events?limit=30" \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          from collections import Counter
          ts=Counter()
          for row in d:
              e=row.get('event',row)
              ts[e.get('type','?')]+=1
          for t,n in ts.most_common(): print('   ',t,n)
          print('    newest:', (d[0].get('event',d[0])).get('timestamp') if d else 'none')
          "
