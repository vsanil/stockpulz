# THROWAWAY probe — does Render's API expose free instance hours?
# Delete once answered. Prints shape only; the key never appears in output.
name: Render usage probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API what it knows
        env:
          K: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          echo "== /v1/owners =="
          OWNERS=$(curl -s -H "Authorization: Bearer $K" https://api.render.com/v1/owners)
          echo "$OWNERS" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for o in (d if isinstance(d,list) else [d]):
              ow=o.get('owner',o)
              print('  id=%s type=%s name=%s' % (ow.get('id'), ow.get('type'), ow.get('name')))
          "
          OID=$(echo "$OWNERS" | python3 -c "import sys,json;d=json.load(sys.stdin);o=(d if isinstance(d,list) else [d])[0];print((o.get('owner',o)).get('id',''))")
          echo
          echo "== /v1/owners/\$OID/usage =="
          curl -s -o /tmp/u.json -w "  http=%{http_code}\n" -H "Authorization: Bearer $K" "https://api.render.com/v1/owners/$OID/usage"
          python3 -c "
          import json
          d=json.load(open('/tmp/u.json'))
          print('  keys:', list(d)[:20] if isinstance(d,dict) else type(d).__name__)
          print(json.dumps(d, indent=1)[:1200])
          " || head -c 400 /tmp/u.json
