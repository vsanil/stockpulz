# THROWAWAY probe — does Render's API expose free instance hours?
# Delete once answered. Prints shape only; the key never appears in output.
name: Render usage probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep the authenticated API surface for anything usage-shaped
        env:
          K: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          OID=tea-d7pehdmgvqtc73a72lbg
          for p in \
            "/v1/owners/$OID" \
            "/v1/owners/$OID/usage" \
            "/v1/owners/$OID/billing" \
            "/v1/owners/$OID/invoices" \
            "/v1/billing/usage?ownerId=$OID" \
            "/v1/usage?ownerId=$OID" \
            "/v1/metrics?ownerId=$OID" \
            "/v1/services?limit=1" \
            "/v1/projects?limit=1" \
            "/v1/notification-settings" \
            "/v1/users/usage" \
            "/v1/instance-hours" ; do
            C=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $K" "https://api.render.com$p")
            SZ=$(wc -c < /tmp/r.json | tr -d ' ')
            printf "  %-40s %s  (%s bytes)\n" "$p" "$C" "$SZ"
            if [ "$C" = "200" ] && [ "$SZ" -lt 900 ]; then sed 's/^/        /' /tmp/r.json | head -6; fi
          done
