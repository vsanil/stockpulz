name: Clean Traffic Counts

# ONE-TIME. Removes the Full Sweep's hits from traffic_hours.json — it was
# counted as the owner (and as a cold start) on every run until 2026-11-15.
# Manual only. Dry run by default; see scripts/clean_traffic.py.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = write the change (default: dry run, prints only)"
        required: false
        default: "false"

permissions:
  actions: read
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Clean traffic counts
        run: python scripts/clean_traffic.py ${{ github.event.inputs.apply == 'true' && '--apply' || '' }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_GIST_TOKEN:    ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:          ${{ secrets.GIST_ID }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
