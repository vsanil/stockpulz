name: Remove Legacy Alerts

# ONE-TIME. Removes 15 system-made alerts from May 2026 that predate the `auto`
# marker and so can never expire. Manual only, dry run by default; see
# scripts/remove_legacy_alerts.py. Delete this workflow after the run.

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "the user's chat id"
        required: true
      apply:
        description: "true = remove (default: dry run, prints only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Remove legacy alerts
        run: python scripts/remove_legacy_alerts.py --chat-id "$CHAT" ${{ github.event.inputs.apply == 'true' && '--apply' || '' }}
        env:
          CHAT:          ${{ github.event.inputs.chat_id }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:       ${{ secrets.GIST_ID }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
