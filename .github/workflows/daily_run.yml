name: StockPulz Scheduled Runs

# All weekday + weekend cron jobs live here, price alerts included.
#
# 🔑 THIS IS THE ONLY WORKFLOW THAT MAY SET RUN_MODE, and that is a rule, not an
# accident. Everything protecting a run lives in this file: the run_mode
# allow-list check, the per-mode `concurrency` group, and the full env — most
# importantly OWNER_ONLY, without which a manual trigger broadcasts to EVERY
# user. A second entry point silently opts out of all three.
# ⚠️ A workflow named price-alerts WAS exactly that, and was removed 2026-09-05.
# It had no schedule and nothing dispatched it, this header still pointed at it,
# and it ran the same `agent.py` with RUN_MODE=price_alerts and EIGHT env vars
# missing — OWNER_ONLY and APP_URL among them. Anyone pressing its
# "Run workflow" button would have messaged every user with no containment.
# 🔎 The manual case it was kept for is fully served by:
#     gh workflow run daily_run.yml -f run_mode=price_alerts -f owner_only=1
# Pinned by tests/test_run_modes.py::TestOnlyOneEntryPointToTheAgent.
#
# Each schedule maps to a RUN_MODE — resolved in the "Set run mode" step.
# Render cron jobs have been retired; only the webhook web service stays on Render.
#
# GitHub Actions free tier:
#   Public repos  → unlimited minutes
#   Private repos → 2000 min/month (these jobs use ~1400 min/month combined)

on:
  # Light jobs are scheduled on cron-job.org → Render /trigger/<mode> endpoints.
  # The PRESCREENER runs HERE: the 600-ticker screener needs more RAM than
  # Render's 512MB instance (proven OOM) — GitHub runners have 7GB.
  # Two shots nightly: 03:00 UTC primary + 07:00 UTC backup (cache save is
  # idempotent; the 10h cache TTL tolerates GH Actions' peak-load delays).
  # Render's /trigger/prescreener endpoint also relays here via workflow
  # dispatch, giving a third, cron-job.org-driven redundant trigger.
  schedule:
    - cron: "0 3 * * 1-5"   # prescreener — primary (11 PM ET)
    - cron: "0 7 * * 1-5"   # prescreener — backup  (3 AM ET)
    # 🔎 Added 2026-09-05. Both modes existed in agent.py AND in the "Set run
    # mode" resolver below, and neither had a trigger anywhere — the wiring was
    # half-done, which is why they had never once run. (tax_harvest was doubly
    # unreachable: detect_run_mode rejected it until run_modes.py landed today.)
    # ⚠️ These live on GitHub's scheduler rather than cron-job.org ON PURPOSE:
    # GH fires 1.6-6 h late, which is fatal for a market-timed job and
    # irrelevant for a monthly commentary or a seasonal tax review. Putting them
    # here costs no cron-job.org job and no PAT.
    - cron: "0 13 1 * *"          # monthly_commentary — 1st of the month
    - cron: "0 14 1,15 11,12 *"   # tax_harvest — 1st & 15th, Nov + Dec only
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Force run mode (leave blank = auto from schedule)"
        required: false
        default: ""
      dry_run:
        description: "true = print only, do not send Telegram messages"
        required: false
        default: "false"
      mock_data:
        description: "true = use mock picks, skip screeners + Claude API (instant ~10s test)"
        required: false
        default: "false"
      force:
        description: "true = bypass the once-per-day morning duplicate guard (recovery)"
        required: false
        default: "false"
      owner_only:
        description: "1 = deliver to the OWNER only (manual test triggers)"
        required: false
        default: ""

# 🚨 Partial replacement for a guard that was LOST on 2026-09-05, when the 17
# cron-job.org jobs stopped calling Render's /trigger/<mode> and began POSTing
# to GitHub's dispatch API directly. That endpoint (webhook.py `trigger_mode`)
# held a per-mode same-day marker, `cron_last_<mode>`, and returned
# {"skipped": true, "reason": "already ran today"} on a repeat. Dispatching
# straight to GitHub walks past it, and for modes that message users a repeat
# means duplicate Telegram messages.
#
# ⚠️ Be honest about what this does and does not restore. Concurrency
# SERIALISES, it does not SKIP: a duplicate that arrives after the first run
# has finished still runs in full. What it does buy:
#   - two runs of the same mode can never overlap (the harmful case: two
#     deliveries interleaving, or two writers racing on the same cache/state)
#   - a burst coalesces — GitHub holds at most one running + one pending per
#     group, and a third arrival cancels the pending one rather than queueing
# ✅ CORRECTED 2026-09-06: `morning` ALREADY has its own same-day guard inside
# agent.py's main() — it reads cron_last_morning and skips when it is already
# today. Proven live: a morning TEST RUN at 01:57 skipped as a duplicate of the
# weekly run at 01:28 (weekly calls run_morning internally). So the highest-stakes
# mode is protected at the POINT OF USE, independent of the transport, which is
# where such a guard belongs. The other 18 modes have no equivalent -- add one
# only if a real duplicate is observed; do not pre-emptively rebuild the marker.
#
# 🔎 `inputs.run_mode` is empty on a `schedule` event, so the fallbacks matter.
# ⚠️ REVISED 2026-09-05, and this supersedes an earlier comment here that said
# the `|| 'prescreener'` default was load-bearing. It WAS, while prescreener was
# the only scheduled mode. Adding the monthly_commentary and tax_harvest crons
# broke that premise and turned the default into a hazard:
#
#   every scheduled run resolved to the SAME group, "daily-run-prescreener".
#   GitHub keeps at most one running + one PENDING per group and CANCELS the
#   pending one when a third arrives — so a scheduled monthly_commentary could
#   be silently dropped behind two prescreener runs. A monthly job that never
#   runs and says nothing is exactly the silent-skip class fixed elsewhere today.
#
# `github.event.schedule` gives each cron its own group, which removes that.
# 🔑 The cost, stated plainly: the three prescreener triggers (03:00 cron, 07:00
# cron, cron-job.org dispatch) no longer share one group, so concurrency no
# longer serialises them. That is acceptable because they cannot overlap — they
# are 4+ hours apart and the job times out at 30 min — whereas the cancellation
# above could really happen. Do not "restore" the shared group without checking
# that arithmetic again.
concurrency:
  group: daily-run-${{ github.event.inputs.run_mode || github.event.schedule || 'prescreener' }}
  cancel-in-progress: false # never kill a run that may have already delivered

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Map each cron expression to the correct RUN_MODE.
      # Manual dispatch can override with run_mode input.
      - name: Set run mode
        id: set_mode
        run: |
          MANUAL="${{ github.event.inputs.run_mode }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [[ -n "$MANUAL" ]]; then
            MODE="$MANUAL"
          elif [[ "$SCHEDULE" == "0 3 * * 1-5" ]]; then
            MODE="prescreener"
          elif [[ "$SCHEDULE" == "0 7 * * 1-5" ]]; then
            MODE="prescreener"   # backup run — cache save is idempotent
          elif [[ "$SCHEDULE" == "45 12 * * 1-5" ]]; then
            MODE="premarket"
          elif [[ "$SCHEDULE" == "0 15 * * 1-5" ]]; then
            MODE="digest"
          elif [[ "$SCHEDULE" == "0 11 * * 1-5" ]]; then
            MODE="morning"
          elif [[ "$SCHEDULE" == "30 14 * * 1-5" ]]; then
            MODE="confirmation"
          elif [[ "$SCHEDULE" == "30 19 * * 1-5" ]]; then
            MODE="close_check"
          elif [[ "$SCHEDULE" == "15 20 * * 1-5" ]]; then
            MODE="eod_summary"
          elif [[ "$SCHEDULE" == "0 12 * * 6" ]]; then
            MODE="weekly"
          elif [[ "$SCHEDULE" == "0 12 * * 0" ]]; then
            MODE="week_ahead"
          elif [[ "$SCHEDULE" == "0 23 * * 5" ]]; then
            MODE="friday_wrap"
          elif [[ "$SCHEDULE" == "0 21 * * 1-4" ]]; then
            MODE="macro_alert"
          elif [[ "$SCHEDULE" == "30 16 * * 1-5" ]]; then
            MODE="midday_check"
          elif [[ "$SCHEDULE" == "0 14 * * 1-5" ]]; then
            MODE="vix_check"
          elif [[ "$SCHEDULE" == "0 16 * * 1-5" ]]; then
            MODE="news_check"
          elif [[ "$SCHEDULE" == "0 20 * * 1-5" ]]; then
            MODE="pre_earnings"
          elif [[ "$SCHEDULE" == "0 13 1 * *" ]]; then
            MODE="monthly_commentary"
          elif [[ "$SCHEDULE" == "0 14 1,15 11,12 *" ]]; then
            MODE="tax_harvest"
          elif [[ "$SCHEDULE" == "0 13 * * 1-5" ]]; then
            MODE="watchdog"
          else
            # Default to prescreener, NOT morning — an unmapped schedule must
            # never send user-facing picks at an unexpected hour.
            echo "Unknown schedule '$SCHEDULE' — defaulting to prescreener"
            MODE="prescreener"
          fi

          # 🚨 VALIDATE before running. GitHub accepts ANY string for
          # inputs.run_mode, and until 2026-09-05 the only gate was
          # webhook.trigger_mode returning 400 for an unknown mode — which the
          # move to direct API dispatch removed. Without this, a typo in one of
          # the 17 cron-job.org bodies reaches agent.py, fails to match, and
          # falls back to CLOCK-BASED detection: measured, `typo_not_a_real_mode`
          # silently ran CONFIRMATION and reported success. Between 03:00-09:59
          # ET the clock says `morning`, which broadcasts to every user.
          # 🔎 Checked here as well as inside agent.py so the run stops BEFORE
          # "Run agent" — the step that screens, calls Claude and messages
          # users — and so the error names the valid modes in the job log where
          # the operator is already looking. (This step runs after pip install,
          # so it does not save that; it saves the expensive, user-visible part.)
          # ⚠️ Keep the python on ONE line. Inside `run: |` every line carries
          # the block's indentation, and indented source in `python3 -c` is an
          # IndentationError — which would fail every run, valid or not.
          if ! python3 -c "import sys; sys.path.insert(0, '.'); from run_modes import check; print('validated run mode:', check('$MODE'))"; then
            echo "::error::Unknown run_mode '$MODE' — refusing to run. An unvalidated mode silently becomes a DIFFERENT job (clock fallback), and between 03:00-09:59 ET that is 'morning', which broadcasts to every user."
            exit 1
          fi

          echo "RUN_MODE=$MODE" >> $GITHUB_ENV
          echo "Resolved RUN_MODE=$MODE"

      - name: Run agent
        run: python agent.py
        env:
          RUN_MODE: ${{ env.RUN_MODE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MOCK_DATA: ${{ github.event.inputs.mock_data || 'false' }}
          FORCE_MORNING: ${{ github.event.inputs.force || 'false' }}
          # Carried through the relay: /trigger/<mode>?owner_only=1 used to set
          # this via the local subprocess env. Without it here, a manual test
          # trigger would broadcast to EVERY user instead of just the owner.
          OWNER_ONLY: ${{ github.event.inputs.owner_only || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          # Storage backend. Must match Render, or GH Actions writes to the Gist
          # while the web service writes to Supabase — the split-brain of 2026-08-19.
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
          APP_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
