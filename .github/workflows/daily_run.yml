name: StockPulz Scheduled Runs

# All weekday + weekend cron jobs live here.
# Price alerts (every 30 min during market hours) are in price_alerts.yml.
#
# Each schedule maps to a RUN_MODE — resolved in the "Set run mode" step.
# Render cron jobs have been retired; only the webhook web service stays on Render.
#
# GitHub Actions free tier:
#   Public repos  → unlimited minutes
#   Private repos → 2000 min/month (these jobs use ~1400 min/month combined)

on:
  schedule:
    # ── Weekday runs (Mon–Fri, UTC times) ──────────────────────────────────────
    - cron: "0 3 * * 1-5"       # 11:00 PM ET  — overnight prescreener (scores 600 tickers)
    - cron: "45 12 * * 1-5"     #  8:45 AM ET  — pre-market pulse for open positions
    - cron: "0 15 * * 1-5"      # 11:00 AM ET  — personalized position digest (mid-morning)
    - cron: "0 11 * * 1-5"      #  7:00 AM ET  — morning picks delivery (pre-market)
    - cron: "30 14 * * 1-5"     # 10:30 AM ET  — confirmation run (1h after open)
    - cron: "30 19 * * 1-5"     #  3:30 PM ET  — EOD close check (30 min before close)
    - cron: "15 20 * * 1-5"     #  4:15 PM ET  — full EOD wrap-up (after close)
    # ── Weekend runs ────────────────────────────────────────────────────────────
    - cron: "0 12 * * 6"        #  8:00 AM ET Saturday — crypto picks + weekly recap
    - cron: "0 12 * * 0"        #  8:00 AM ET Sunday   — Week Ahead briefing
    - cron: "0 23 * * 5"        #  7:00 PM ET Friday   — Friday evening wrap-up
    - cron: "0 21 * * 1-4"      #  5:00 PM ET Mon–Thu  — macro event alert check
    - cron: "30 16 * * 1-5"     # 12:30 PM ET weekdays — midday intraday check
    - cron: "0 14 * * 1-5"      # 10:00 AM ET weekdays — VIX volatility spike alerts
    - cron: "0 16 * * 1-5"      # 12:00 PM ET weekdays — position news digest (midday)
    - cron: "0 20 * * 1-5"      #  4:00 PM ET weekdays — pre-earnings guidance
    - cron: "0 13 1 * *"        #  9:00 AM ET 1st of month — monthly market commentary
    - cron: "0 14 1,15 11,12 *" #  9:00 AM ET 1st + 15th of Nov/Dec — tax-loss harvest check
    - cron: "0 13 * * 1-5"     #  9:00 AM ET weekdays — watchdog (alerts if morning run was missed)

  # Manual trigger — useful for testing individual modes without waiting for schedule
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Force run mode (leave blank = auto from schedule)"
        required: false
        default: ""
      dry_run:
        description: "true = print only, do not send Telegram messages"
        required: false
        default: "false"
      mock_data:
        description: "true = use mock picks, skip screeners + Claude API (instant ~10s test)"
        required: false
        default: "false"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Map each cron expression to the correct RUN_MODE.
      # Manual dispatch can override with run_mode input.
      - name: Set run mode
        id: set_mode
        run: |
          MANUAL="${{ github.event.inputs.run_mode }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [[ -n "$MANUAL" ]]; then
            MODE="$MANUAL"
          elif [[ "$SCHEDULE" == "0 3 * * 1-5" ]]; then
            MODE="prescreener"
          elif [[ "$SCHEDULE" == "45 12 * * 1-5" ]]; then
            MODE="premarket"
          elif [[ "$SCHEDULE" == "0 15 * * 1-5" ]]; then
            MODE="digest"
          elif [[ "$SCHEDULE" == "0 11 * * 1-5" ]]; then
            MODE="morning"
          elif [[ "$SCHEDULE" == "30 14 * * 1-5" ]]; then
            MODE="confirmation"
          elif [[ "$SCHEDULE" == "30 19 * * 1-5" ]]; then
            MODE="close_check"
          elif [[ "$SCHEDULE" == "15 20 * * 1-5" ]]; then
            MODE="eod_summary"
          elif [[ "$SCHEDULE" == "0 12 * * 6" ]]; then
            MODE="weekly"
          elif [[ "$SCHEDULE" == "0 12 * * 0" ]]; then
            MODE="week_ahead"
          elif [[ "$SCHEDULE" == "0 23 * * 5" ]]; then
            MODE="friday_wrap"
          elif [[ "$SCHEDULE" == "0 21 * * 1-4" ]]; then
            MODE="macro_alert"
          elif [[ "$SCHEDULE" == "30 16 * * 1-5" ]]; then
            MODE="midday_check"
          elif [[ "$SCHEDULE" == "0 14 * * 1-5" ]]; then
            MODE="vix_check"
          elif [[ "$SCHEDULE" == "0 16 * * 1-5" ]]; then
            MODE="news_check"
          elif [[ "$SCHEDULE" == "0 20 * * 1-5" ]]; then
            MODE="pre_earnings"
          elif [[ "$SCHEDULE" == "0 13 1 * *" ]]; then
            MODE="monthly_commentary"
          elif [[ "$SCHEDULE" == "0 14 1,15 11,12 *" ]]; then
            MODE="tax_harvest"
          elif [[ "$SCHEDULE" == "0 13 * * 1-5" ]]; then
            MODE="watchdog"
          else
            echo "Unknown schedule '$SCHEDULE' — defaulting to morning"
            MODE="morning"
          fi

          echo "RUN_MODE=$MODE" >> $GITHUB_ENV
          echo "Resolved RUN_MODE=$MODE"

      - name: Run agent
        run: python agent.py
        env:
          RUN_MODE: ${{ env.RUN_MODE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MOCK_DATA: ${{ github.event.inputs.mock_data || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
          APP_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
