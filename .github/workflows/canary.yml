name: Daily Canary

# Synthetic end-to-end health check + calculation audit. Runs as the admin
# account, exercises every path (picks, prices, sizing, paper trade, alerts,
# watchlist, backtest, delivery/cron health, endpoint health), verifies the math,
# and DMs a report to the admin. Non-destructive (snapshot→act→restore).
#
# TRIGGER: cron-job.org job 8454784, 7:30 AM ET DAILY, POSTing this workflow's
# dispatch endpoint directly. NOT a GitHub `schedule:` — see below.
#
# 7:30 AM ET is ~30 min after the 7 AM ET morning delivery, so the delivery
# checks can confirm today's picks actually went out. ET-anchored on purpose:
# the morning relay (cron-job.org job 7726933) is ET-anchored too, so a fixed
# UTC canary would drift against it by an hour at every DST change. 7:30 AM ET
# is the same calendar day in UTC under both EDT and EST, and this job runs
# daily anyway, so no weekday can shift.
#
# 🔴 DO NOT RE-ADD A `schedule:` CRON HERE. GitHub's scheduler fired this
# workflow at 05:33, 15:38, 16:29 and 18:06 UTC against a nominal 12:30 — it
# drops runs and lands hours late, so the delivery checks were grading a
# window that had long closed. Worse, with BOTH triggers live the canary runs
# TWICE a day: two DMs, two sets of mutating snapshot->restore round-trips
# against production storage, and two deliberate Render wakes (~0.28 h each).
# Same reasoning that removed synthetic_user's `0 12` cron on 2026-09-15.
#
# Public repo → GitHub Actions minutes are unlimited; this is about WHEN it
# fires, not what it costs.

on:
  workflow_dispatch: {}         # cron-job.org dispatches this; also "run now"

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # raised from 10 (2026-09-05): endpoint.health now WAKES
                          # the free instance and can spend up to 4 min doing it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt
      - name: Run canary
        run: python scripts/canary.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN:      ${{ secrets.GH_GIST_TOKEN }}
          # Automatic workflow token — has actions:read, which GH_GIST_TOKEN
          # (a gist-scoped PAT) does not. check_silent_failures needs it to
          # read the LOGS of successful runs; without it that check reports
          # CANNOT VERIFY rather than passing.
          GH_ACTIONS_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          # Storage backend. Must match Render, or GH Actions writes to the Gist
          # while the web service writes to Supabase — the split-brain of 2026-08-19.
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:            ${{ secrets.GIST_ID }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
